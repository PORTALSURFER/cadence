[package]
name = "cadence-native"
version = "0.1.4"
edition = "2024"
publish = false
description = "Native Cadence track review workspace built with Radiant"

[dependencies]
ebur128 = "0.1.10"
radiant = { git = "https://github.com/PORTALSURFER/radiant", rev = "810e3a677965a87be1451d7d47ec21286d318f99" }
libc = "0.2.189"
rfd = "0.16.0"
rodio = { version = "0.22.2", features = ["symphonia-all"] }
rtrb = "0.3.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
symphonia = { version = "0.5.5", features = ["all"] }
