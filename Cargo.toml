[package]
name = "cadence-native"
version = "0.1.9"
edition = "2024"
publish = false
description = "Native Cadence track review workspace built with Radiant"

[dependencies]
ebur128 = "0.1.10"
radiant = { git = "https://github.com/PORTALSURFER/radiant", rev = "8f05f3a6f7c2511d89dc603aab8e0dd33923fab0" }
libc = "0.2.189"
rfd = "0.16.0"
rodio = { version = "0.22.2", features = ["symphonia-all"] }
rtrb = "0.3.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
symphonia = { version = "0.5.5", features = ["all"] }
