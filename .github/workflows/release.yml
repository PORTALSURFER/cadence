name: Cadence release

on:
  push:
    tags:
      - "v*.*.*"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        default: stable
        type: choice
        options:
          - stable
          - nightly
      version:
        description: "Stable semver version without the v prefix; leave blank for nightly"
        required: false
        type: string

concurrency:
  group: cadence-release
  cancel-in-progress: false

jobs:
  reserve_nightly:
    name: Reserve nightly source
    if: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.channel == 'nightly')) && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: cadence-production
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.reserve.outputs.source_sha }}
      reserved_base_version: ${{ steps.reserve.outputs.reserved_base_version }}
      reservation_tag: ${{ steps.reserve.outputs.reservation_tag }}
    steps:
      - name: Check out source for nightly reservation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}

      - name: Reserve nightly source
        id: reserve
        shell: bash
        env:
          REF: ${{ github.ref }}
          RUN_NUMBER: ${{ github.run_number }}
          ORIGINAL_SOURCE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          base_version_re='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          cargo_version_from_file() {
            sed -n '/^\[package\]/,/^\[/{ s/^version = "\([^"]*\)"/\1/p; }' "$1" | head -n 1
          }
          lock_version_from_file() {
            awk '
              /^\[\[package\]\]$/ { in_package=1; is_cadence=0; next }
              in_package && /^\[/ { in_package=0 }
              in_package && $0 == "name = \"cadence-native\"" { is_cadence=1; next }
              in_package && is_cadence && /^version = / {
                sub(/^version = "/, "")
                sub(/"$/, "")
                print
                exit
              }
            ' "$1"
          }
          write_reserved_package_version() {
            python3 - "$1" <<'PY'
          import pathlib
          import re
          import sys

          version = sys.argv[1]
          patterns = {
              pathlib.Path("Cargo.toml"): re.compile(
                  r'(?ms)^\[package\]\nname = "cadence-native"\nversion = "[^"]+"'
              ),
              pathlib.Path("Cargo.lock"): re.compile(
                  r'(?ms)^\[\[package\]\]\nname = "cadence-native"\nversion = "[^"]+"'
              ),
          }
          for path, pattern in patterns.items():
              text = path.read_text(encoding="utf-8")
              matches = list(pattern.finditer(text))
              if len(matches) != 1:
                  raise SystemExit(f"expected exactly one Cadence package entry in {path}")
              match = matches[0]
              replacement = re.sub(r'version = "[^"]+"$', f'version = "{version}"', match.group(0))
              path.write_text(text[:match.start()] + replacement + text[match.end():], encoding="utf-8")
          PY
          }
          assert_package_versions() {
            local expected="$1"
            local toml_version
            local lock_version
            toml_version="$(cargo_version_from_file Cargo.toml)"
            lock_version="$(lock_version_from_file Cargo.lock)"
            [[ "$toml_version" == "$expected" ]] || { echo "Cargo.toml Cadence version $toml_version does not match $expected" >&2; exit 1; }
            [[ "$lock_version" == "$expected" ]] || { echo "Cargo.lock Cadence version $lock_version does not match $expected" >&2; exit 1; }
          }
          assert_reservation_commit() {
            local commit="$1"
            local expected="$2"
            [[ "$(git rev-list --parents -n 1 "$commit")" == "$commit $original_source_sha" ]] || {
              echo "nightly reservation tag must point to the original source or a single reservation commit with the original source as its exact parent" >&2
              exit 1
            }
            changed_status="$(git diff-tree --no-commit-id --name-status -r "$commit" | LC_ALL=C sort)"
            [[ "$changed_status" == $'M\tCargo.lock\nM\tCargo.toml' ]] || {
              echo "nightly reservation commit must modify only Cargo.toml and Cargo.lock" >&2
              exit 1
            }
            [[ -z "$(git diff --no-ext-diff --summary "$original_source_sha" "$commit" -- Cargo.lock Cargo.toml)" ]] || {
              echo "nightly reservation commit must not change file modes" >&2
              exit 1
            }
            python3 - "$original_source_sha" "$commit" "$original_cargo_version" "$expected" <<'PY'
          import re
          import subprocess
          import sys

          parent, commit, original, expected = sys.argv[1:]
          patterns = {
              "Cargo.toml": re.compile(
                  r'(?ms)^\[package\]\nname = "cadence-native"\nversion = "([^"]+)"'
              ),
              "Cargo.lock": re.compile(
                  r'(?ms)^\[\[package\]\]\nname = "cadence-native"\nversion = "([^"]+)"'
              ),
          }

          def contents(revision, path):
              return subprocess.check_output(
                  ["git", "show", f"{revision}:{path}"], text=True
              )

          def normalize(text, match):
              return text[:match.start(1)] + expected + text[match.end(1):]

          for path, pattern in patterns.items():
              before = contents(parent, path)
              after = contents(commit, path)
              before_matches = list(pattern.finditer(before))
              after_matches = list(pattern.finditer(after))
              if len(before_matches) != 1 or len(after_matches) != 1:
                  raise SystemExit(f"expected one Cadence package entry in {path}")
              before_match = before_matches[0]
              after_match = after_matches[0]
              if before_match.group(1) != original:
                  raise SystemExit(f"original Cadence package version drifted in {path}")
              if after_match.group(1) != expected:
                  raise SystemExit(f"reservation version mismatch in {path}")
              if normalize(before, before_match) != normalize(after, after_match):
                  raise SystemExit(f"reservation commit changed non-version content in {path}")
          PY
          }
          write_output() {
            printf '%s\n' "$1=$2" >> "$GITHUB_OUTPUT"
          }

          [[ "$REF" == refs/heads/main ]] || { echo "automatic nightly releases must run from the main branch" >&2; exit 1; }
          [[ "$ORIGINAL_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "GitHub did not provide a full commit SHA" >&2; exit 1; }
          [[ "$RUN_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "GitHub run number is not a positive integer" >&2; exit 1; }
          original_source_sha="$(printf '%s' "$ORIGINAL_SOURCE_SHA" | tr '[:upper:]' '[:lower:]')"
          original_cargo_version="$(cargo_version_from_file Cargo.toml)"
          original_lock_version="$(lock_version_from_file Cargo.lock)"
          original_cargo_base_version="${original_cargo_version%%-*}"
          [[ "$original_cargo_base_version" =~ ^${base_version_re}$ ]] || { echo "Cargo.toml does not contain a numeric package version" >&2; exit 1; }
          [[ "$original_lock_version" == "$original_cargo_version" ]] || {
            echo "Cargo.toml and Cargo.lock Cadence package versions differ: $original_cargo_version vs $original_lock_version" >&2
            exit 1
          }

          reservation_tag="cadence-nightly-${RUN_NUMBER}-${original_source_sha:0:12}"
          existing_tag_ref="$(git ls-remote --refs origin "refs/tags/$reservation_tag" | awk 'NF == 2 { print; found++ } END { if (found > 1) exit 1 }')"
          if [[ -n "$existing_tag_ref" ]]; then
            git fetch --no-tags origin "refs/tags/$reservation_tag:refs/tags/$reservation_tag"
            [[ "$(git cat-file -t "refs/tags/$reservation_tag")" == commit ]] || {
              echo "nightly reservation tag is not a lightweight commit tag: $reservation_tag" >&2
              exit 1
            }
            source_sha="$(git rev-parse "refs/tags/$reservation_tag^{commit}")"
            reserved_cargo_version="$(git show "$source_sha:Cargo.toml" | sed -n '/^\[package\]/,/^\[/{ s/^version = "\([^"]*\)"/\1/p; }' | head -n 1)"
            reserved_lock_version="$(git show "$source_sha:Cargo.lock" | awk '
              /^\[\[package\]\]$/ { in_package=1; is_cadence=0; next }
              in_package && /^\[/ { in_package=0 }
              in_package && $0 == "name = \"cadence-native\"" { is_cadence=1; next }
              in_package && is_cadence && /^version = / {
                sub(/^version = "/, "")
                sub(/"$/, "")
                print
                exit
              }
            ')"
            reserved_base_version="${reserved_cargo_version%%-*}"
            [[ "$reserved_base_version" =~ ^${base_version_re}$ ]] || { echo "reservation tag does not contain a numeric Cadence package version" >&2; exit 1; }
            [[ "$reserved_cargo_version" == "$reserved_base_version" ]] || { echo "reservation Cargo package version must be numeric: $reserved_cargo_version" >&2; exit 1; }
            [[ "$reserved_lock_version" == "$reserved_cargo_version" ]] || { echo "reservation Cargo.toml and Cargo.lock versions differ" >&2; exit 1; }
            if [[ "$source_sha" != "$original_source_sha" ]]; then
              assert_reservation_commit "$source_sha" "$reserved_cargo_version"
            fi
          else
            git fetch --no-tags origin main
            [[ "$(git rev-parse origin/main)" == "$original_source_sha" ]] || {
              echo "main advanced after the nightly source was selected; refusing to reserve a version" >&2
              exit 1
            }
            release_names="$(gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .published_at != null) | .name')"
            if [[ -n "$release_names" ]]; then
              reserved_base_version="$(printf '%s' "$release_names" | ./scripts/release/allocate_nightly_version.sh "$original_cargo_base_version")"
            else
              reserved_base_version="$(./scripts/release/allocate_nightly_version.sh "$original_cargo_base_version")"
            fi
            write_reserved_package_version "$reserved_base_version"
            assert_package_versions "$reserved_base_version"
            unexpected_files="$(git diff --name-only | grep -v -E '^(Cargo\.toml|Cargo\.lock)$' || true)"
            [[ -z "$unexpected_files" ]] || { echo "nightly reservation changed unexpected files: $unexpected_files" >&2; exit 1; }
            if ! git diff --quiet -- Cargo.toml Cargo.lock; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add Cargo.toml Cargo.lock
              [[ "$(git diff --cached --name-only)" == $'Cargo.lock\nCargo.toml' ]] || {
                echo "nightly reservation commit must contain only Cargo.toml and Cargo.lock" >&2
                exit 1
              }
              git commit -m "chore(release): reserve Cadence ${reserved_base_version} nightly"
            fi
            if git show-ref --verify --quiet "refs/tags/$reservation_tag"; then
              echo "local nightly reservation tag already exists unexpectedly: $reservation_tag" >&2
              exit 1
            fi
            if git ls-remote --exit-code --refs origin "refs/tags/$reservation_tag" >/dev/null 2>&1; then
              echo "nightly reservation tag appeared concurrently: $reservation_tag" >&2
              exit 1
            fi
            git tag "$reservation_tag"
            git push --atomic origin HEAD:refs/heads/main "refs/tags/$reservation_tag"
            source_sha="$(git rev-parse HEAD)"
            assert_package_versions "$reserved_base_version"
          fi

          [[ "$source_sha" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "nightly reservation did not produce a full commit SHA" >&2; exit 1; }
          [[ "$reserved_base_version" =~ ^${base_version_re}$ ]] || { echo "nightly reservation did not produce a numeric base version" >&2; exit 1; }
          write_output source_sha "$(printf '%s' "$source_sha" | tr '[:upper:]' '[:lower:]')"
          write_output reserved_base_version "$reserved_base_version"
          write_output reservation_tag "$reservation_tag"

  prepare:
    name: Prepare release metadata
    needs: reserve_nightly
    if: ${{ always() && (needs.reserve_nightly.result == 'success' || needs.reserve_nightly.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.release.outputs.channel }}
      version: ${{ steps.release.outputs.version }}
      build_id: ${{ steps.release.outputs.build_id }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      tag_release: ${{ steps.release.outputs.tag_release }}
      create_github_release: ${{ steps.release.outputs.create_github_release }}
      artifact_upload_name: ${{ steps.release.outputs.artifact_upload_name }}
      source_sha: ${{ steps.release.outputs.source_sha }}
    steps:
      - name: Validate manual stable source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_CHANNEL: ${{ inputs.channel || '' }}
          INPUT_VERSION: ${{ inputs.version || '' }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$INPUT_CHANNEL" == "stable" ]]; then
            [[ "$REF" == "refs/heads/main" || "$REF" == "refs/tags/v${INPUT_VERSION}" ]] || {
              echo "manual stable releases must run from refs/heads/main or the matching v<version> tag" >&2
              exit 1
            }
          fi

      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.reserve_nightly.outputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Select release metadata
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          ORIGINAL_SOURCE_SHA: ${{ github.sha }}
          RESERVED_SOURCE_SHA: ${{ needs.reserve_nightly.outputs.source_sha || '' }}
          RESERVED_BASE_VERSION: ${{ needs.reserve_nightly.outputs.reserved_base_version || '' }}
          RESERVATION_TAG: ${{ needs.reserve_nightly.outputs.reservation_tag || '' }}
          INPUT_CHANNEL: ${{ inputs.channel || '' }}
          INPUT_VERSION: ${{ inputs.version || '' }}
        run: |
          set -euo pipefail

          base_version_re='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          stable_version_re="^${base_version_re}$"
          rc_version_re="^${base_version_re}-rc\.[1-9][0-9]*$"
          nightly_version_re="^${base_version_re}-nightly\.[1-9][0-9]*$"
          cargo_version_from_file() {
            sed -n '/^\[package\]/,/^\[/{ s/^version = "\([^"]*\)"/\1/p; }' "$1" | head -n 1
          }
          lock_version_from_file() {
            awk '
              /^\[\[package\]\]$/ { in_package=1; is_cadence=0; next }
              in_package && /^\[/ { in_package=0 }
              in_package && $0 == "name = \"cadence-native\"" { is_cadence=1; next }
              in_package && is_cadence && /^version = / {
                sub(/^version = "/, "")
                sub(/"$/, "")
                print
                exit
              }
            ' "$1"
          }
          write_output() {
            printf '%s\n' "$1=$2" >> "$GITHUB_OUTPUT"
          }

          [[ "$ORIGINAL_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "GitHub did not provide a full commit SHA" >&2; exit 1; }
          [[ "$RUN_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "GitHub run number is not a positive integer" >&2; exit 1; }
          original_source_sha="$(printf '%s' "$ORIGINAL_SOURCE_SHA" | tr '[:upper:]' '[:lower:]')"
          original_cargo_version="$(cargo_version_from_file Cargo.toml)"
          original_lock_version="$(lock_version_from_file Cargo.lock)"
          original_cargo_base_version="${original_cargo_version%%-*}"
          [[ "$original_cargo_base_version" =~ ^${base_version_re}$ ]] || { echo "Cargo.toml does not contain a numeric package version" >&2; exit 1; }
          [[ "$original_lock_version" == "$original_cargo_version" ]] || {
            echo "Cargo.toml and Cargo.lock Cadence package versions differ: $original_cargo_version vs $original_lock_version" >&2
            exit 1
          }

          channel=""
          version=""
          build_id=""
          release_tag=""
          tag_release=false
          create_github_release=false
          source_sha="$original_source_sha"
          automatic_nightly=false

          case "$EVENT_NAME" in
            push)
              [[ "$REF" == refs/tags/v* ]] || { echo "push releases must run from a v-prefixed tag" >&2; exit 1; }
              version="${REF_NAME#v}"
              release_tag="$REF_NAME"
              tag_release=true
              if [[ "$version" =~ $stable_version_re ]]; then
                channel=stable
              elif [[ "$version" =~ $rc_version_re ]]; then
                channel=rc
              elif [[ "$version" =~ $nightly_version_re ]]; then
                channel=nightly
              else
                echo "tag version must be X.Y.Z, X.Y.Z-rc.N, or X.Y.Z-nightly.N: $version" >&2
                exit 2
              fi
              ;;
            schedule)
              channel=nightly
              automatic_nightly=true
              ;;
            workflow_dispatch)
              channel="$INPUT_CHANNEL"
              case "$channel" in
                stable)
                  [[ -n "$INPUT_VERSION" ]] || { echo "stable manual releases require the version input" >&2; exit 2; }
                  version="$INPUT_VERSION"
                  ;;
                nightly)
                  [[ -z "$INPUT_VERSION" ]] || { echo "nightly manual releases use the reserved Cargo base version plus the run number; leave version blank" >&2; exit 2; }
                  automatic_nightly=true
                  ;;
                *)
                  echo "invalid release channel: $channel" >&2
                  exit 2
                  ;;
              esac
              if [[ "$channel" == stable && "$REF" == refs/tags/* ]]; then
                [[ "$REF_NAME" == "v${version}" ]] || { echo "stable version $version does not match tag $REF_NAME" >&2; exit 1; }
                release_tag="$REF_NAME"
                tag_release=true
              fi
              ;;
            *)
              echo "unsupported release event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          if [[ "$automatic_nightly" == true ]]; then
            [[ "$REF" == refs/heads/main ]] || { echo "automatic nightly releases must run from the main branch" >&2; exit 1; }
            [[ "$RESERVED_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "nightly reservation did not provide a full source SHA" >&2; exit 1; }
            [[ "$RESERVED_BASE_VERSION" =~ ^${base_version_re}$ ]] || { echo "nightly reservation did not provide a numeric base version" >&2; exit 1; }
            [[ "$RESERVATION_TAG" == cadence-nightly-* ]] || { echo "nightly reservation did not provide a reservation tag" >&2; exit 1; }
            source_sha="$(printf '%s' "$RESERVED_SOURCE_SHA" | tr '[:upper:]' '[:lower:]')"
            reserved_base_version="$RESERVED_BASE_VERSION"
            reservation_tag="$RESERVATION_TAG"
            [[ "$(git rev-parse HEAD)" == "$source_sha" ]] || { echo "prepared source does not match the nightly reservation" >&2; exit 1; }
            version="${reserved_base_version}-nightly.${RUN_NUMBER}"
            release_tag="$reservation_tag"
            tag_release=true
          fi

          case "$channel" in
            stable)
              [[ "$version" =~ $stable_version_re ]] || { echo "stable releases require X.Y.Z: $version" >&2; exit 2; }
              [[ "$original_cargo_version" == "$version" ]] || { echo "Cargo.toml version $original_cargo_version does not match stable version $version" >&2; exit 1; }
              ;;
            rc)
              [[ "$version" =~ $rc_version_re ]] || { echo "rc releases require X.Y.Z-rc.N: $version" >&2; exit 2; }
              ;;
            nightly)
              [[ "$version" =~ $nightly_version_re ]] || { echo "nightly releases require X.Y.Z-nightly.N: $version" >&2; exit 2; }
              ;;
            *)
              echo "invalid release channel: $channel" >&2
              exit 2
              ;;
          esac

          version_base="${version%%-*}"
          if [[ "$automatic_nightly" == true ]]; then
            [[ "$version_base" == "$reserved_base_version" ]] || { echo "reserved version $reserved_base_version does not match release version $version" >&2; exit 1; }
          else
            [[ "$version_base" == "$original_cargo_base_version" ]] || { echo "Cargo.toml base version $original_cargo_base_version does not match release version $version" >&2; exit 1; }
          fi

          short_sha="${source_sha:0:12}"
          if [[ "$channel" == stable ]]; then
            build_id="cadence-v${version}-${RUN_NUMBER}"
          else
            build_id="cadence-${channel}-${RUN_NUMBER}-${short_sha}"
            if [[ "$tag_release" != true ]]; then
              release_tag="$build_id"
            fi
          fi

          if [[ "$tag_release" == true || ( "$channel" == nightly && -n "$release_tag" ) || "$channel" == rc ]]; then
            create_github_release=true
          fi

          artifact_upload_name="cadence-v${version}-macos-arm64"
          if [[ "$channel" != stable ]]; then
            artifact_upload_name="cadence-${channel}-v${version}-macos-arm64"
          fi

          write_output channel "$channel"
          write_output version "$version"
          write_output build_id "$build_id"
          write_output release_tag "$release_tag"
          write_output tag_release "$tag_release"
          write_output create_github_release "$create_github_release"
          write_output artifact_upload_name "$artifact_upload_name"
          write_output source_sha "$source_sha"

  build:
    name: Build and sign release
    needs: prepare
    runs-on: macos-14
    environment: cadence-production
    permissions:
      contents: read
      actions: read
    outputs:
      channel: ${{ needs.prepare.outputs.channel }}
      version: ${{ needs.prepare.outputs.version }}
      build_id: ${{ needs.prepare.outputs.build_id }}
      release_tag: ${{ needs.prepare.outputs.release_tag }}
      tag_release: ${{ needs.prepare.outputs.tag_release }}
      create_github_release: ${{ needs.prepare.outputs.create_github_release }}
      artifact_upload_name: ${{ needs.prepare.outputs.artifact_upload_name }}
      source_sha: ${{ needs.prepare.outputs.source_sha }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: Install Apple Silicon Rust target
        run: rustup target add --toolchain stable aarch64-apple-darwin

      - name: Run Rust validation
        run: |
          cargo +stable test --locked
          cargo +stable clippy --all-targets --all-features --locked -- -D warnings

      - name: Reuse existing release artifact when available
        id: reuse_artifact
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.prepare.outputs.artifact_upload_name }}
          path: release-output
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}

      - name: Build, sign, notarize, and describe release
        if: steps.reuse_artifact.outcome != 'success'
        env:
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_BUILD_ID: ${{ needs.prepare.outputs.build_id }}
          GITHUB_SHA: ${{ needs.prepare.outputs.source_sha }}
          APPLE_DEVELOPER_ID_APPLICATION_CERT_BASE64: ${{ secrets.CADENCE_PRODUCTION_APPLE_DEVELOPER_ID_APPLICATION_CERT_BASE64 }}
          APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD: ${{ secrets.CADENCE_PRODUCTION_APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.CADENCE_PRODUCTION_APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.CADENCE_PRODUCTION_APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.CADENCE_PRODUCTION_APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          export GITHUB_SHA="${{ needs.prepare.outputs.source_sha }}"
          ./scripts/release/build_macos_release.sh \
            --version "$RELEASE_VERSION" \
            --channel "$RELEASE_CHANNEL" \
            --build-id "$RELEASE_BUILD_ID"

      - name: Upload immutable release artifact
        if: steps.reuse_artifact.outcome != 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ needs.prepare.outputs.artifact_upload_name }}
          path: release-output/
          if-no-files-found: error
          overwrite: false

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    environment: cadence-production
    permissions:
      contents: write
      actions: read
    env:
      PORTALSURFER_RELEASE_ENDPOINT: ${{ vars.PORTALSURFER_RELEASE_ENDPOINT || 'https://portalsurfer.org' }}
      RELEASE_CHANNEL: ${{ needs.build.outputs.channel }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      RELEASE_BUILD_ID: ${{ needs.build.outputs.build_id }}
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
      RELEASE_TAG_EXISTS: ${{ needs.build.outputs.tag_release }}
      SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
    steps:
      - name: Check out source for release publisher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          persist-credentials: false

      - name: Download exact release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact_upload_name }}
          path: release-output
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}

      - name: Verify downloaded release metadata
        shell: bash
        run: |
          set -euo pipefail
          manifest_path=release-output/cadence-release-manifest.json
          artifact_path="release-output/cadence-v${RELEASE_VERSION}-macos-arm64.zip"
          [[ -s "$manifest_path" ]] || { echo "downloaded release manifest is missing" >&2; exit 1; }
          [[ -s "$artifact_path" ]] || { echo "downloaded release archive is missing" >&2; exit 1; }
          jq -e \
            --arg version "$RELEASE_VERSION" \
            --arg channel "$RELEASE_CHANNEL" \
            --arg build_id "$RELEASE_BUILD_ID" \
            --arg git_sha "$SOURCE_SHA" \
            '.version == $version and .channel == $channel and .build_id == $build_id and .source.git_sha == $git_sha' \
            "$manifest_path" >/dev/null

      - name: Verify release tag target
        if: needs.build.outputs.create_github_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./scripts/release/verify_tag_target.sh \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --source-sha "$SOURCE_SHA"

      - name: Create or verify GitHub release idempotently
        if: needs.build.outputs.create_github_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release_assets=(
            "release-output/cadence-v${RELEASE_VERSION}-macos-arm64.zip"
            "release-output/SHA256SUMS.txt"
            "release-output/cadence-release-manifest.json"
          )
          for asset in "${release_assets[@]}"; do
            [[ -s "$asset" ]] || { echo "release asset is missing: $asset" >&2; exit 1; }
          done

          if ! gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease >/dev/null 2>&1; then
            if [[ "$RELEASE_CHANNEL" == stable ]]; then
              gh release create "$RELEASE_TAG" \
                "${release_assets[@]}" \
                --repo "$GITHUB_REPOSITORY" \
                --verify-tag \
                --generate-notes \
                --title "Cadence ${RELEASE_VERSION}"
            elif [[ "$RELEASE_TAG_EXISTS" == true ]]; then
              gh release create "$RELEASE_TAG" \
                "${release_assets[@]}" \
                --repo "$GITHUB_REPOSITORY" \
                --verify-tag \
                --prerelease \
                --generate-notes \
                --title "Cadence ${RELEASE_VERSION} ${RELEASE_CHANNEL}"
            else
              gh release create "$RELEASE_TAG" \
                "${release_assets[@]}" \
                --repo "$GITHUB_REPOSITORY" \
                --target "$SOURCE_SHA" \
                --prerelease \
                --generate-notes \
                --title "Cadence ${RELEASE_VERSION} ${RELEASE_CHANNEL}"
            fi
          fi

          expected_prerelease=false
          if [[ "$RELEASE_CHANNEL" != stable ]]; then
            expected_prerelease=true
          fi
          release_info="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease)"
          jq -e \
            --arg tag "$RELEASE_TAG" \
            --argjson expected_prerelease "$expected_prerelease" \
            '.tagName == $tag and .isDraft == false and .isPrerelease == $expected_prerelease' \
            <<<"$release_info" >/dev/null || {
              echo "GitHub release metadata does not match the selected Cadence release" >&2
              exit 1
            }

          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          for asset in "${release_assets[@]}"; do
            asset_name="$(basename "$asset")"
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$asset_name" \
              --dir "$verify_dir"
            cmp -s "$asset" "$verify_dir/$asset_name" || {
              echo "GitHub release asset differs from the immutable build: $asset_name" >&2
              exit 1
            }
          done

      - name: Publish exact release to PortalSurfer
        env:
          CADENCE_RELEASE_UPLOAD_TOKEN: ${{ secrets.CADENCE_PRODUCTION_PORTALSURFER_RELEASE_TOKEN }}
        run: |
          node scripts/release/publish_release.mjs \
            --manifest release-output/cadence-release-manifest.json \
            --root release-output
